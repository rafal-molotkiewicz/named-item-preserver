# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Force Gradle to use a specific JDK (set to system JDK 25)
# Use forward slashes to avoid escaping issues in properties files
org.gradle.java.home=C:/Program Files/Java/jdk-25

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=0.1.3
maven_group=pl.molot.nip
archives_base_name=named-item-preserver

# Dependencies
fabric_version=0.148.0+26.1.2
